<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Odin: find the code behind any bug report</title>
  <meta name="description" content="Paste a bug report, get the functions most likely to need the fix. Odin searches any public Python repository, right in your browser.">
  <meta name="theme-color" content="#faf6ee">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Odin: find the code behind any bug report">
  <meta property="og:description" content="Paste a bug report, get the functions most likely to need the fix. Works on any public Python repository, right in your browser.">
  <meta property="og:url" content="https://allfather.dev/">
  <link rel="canonical" href="https://allfather.dev/">
  <meta property="og:image" content="https://allfather.dev/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://api.github.com" crossorigin>
  <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
  <script>
    // Light or dark before first paint, so the page never flashes the wrong colours: the
    // visitor's choice from the toggle, else light.
    (function () {
      var t = null;
      try { t = JSON.parse(localStorage.getItem("theme")); } catch (e) {}
      if (t !== "light" && t !== "dark") t = "light";
      document.documentElement.dataset.theme = t;
      if (t === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0f1424");
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript><p style="padding:24px">Odin runs a search engine in your browser, so it needs JavaScript.</p></noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
