name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests benchmarks scripts
      - run: uv run ruff format --check src tests benchmarks scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 24  # runs the website's TypeScript engine directly for the parity tests
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run typecheck && npm test && npm run build
        working-directory: web
      - run: uv run pytest -q
