name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # astral publishes exact version tags only
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests benchmarks scripts
      - run: uv run ruff format --check src tests benchmarks scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 24  # runs the website's TypeScript engine directly for the parity tests
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run typecheck && npm test && npm run build
        working-directory: web
      - run: uv run pytest -q
      - run: uv run python scripts/check_readme.py

  e2e:
    # The production build in Chromium, Firefox and WebKit: pages, search on a fixture
    # repository, and the phone layout on an Android and an iPhone profile.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: web
      - run: npm run build && npm run e2e
        working-directory: web
