name = "odin-archive-relay"
main = "cloudflare-worker.js"
compatibility_date = "2026-09-01"

# Origins allowed to use the relay (the Pages site and local previews); empty means any.
[vars]
ALLOWED_ORIGINS = "https://lazeeez.github.io,http://localhost:5173,http://localhost:4173,http://127.0.0.1:4173"

[env.production]
name = "odin-relay"
routes = [{ pattern = "odin.allfather.dev/relay/*", zone_name = "allfather.dev" }]

[env.production.vars]
ROUTE_PREFIX = "/relay"
ALLOWED_ORIGINS = "https://odin.allfather.dev"
